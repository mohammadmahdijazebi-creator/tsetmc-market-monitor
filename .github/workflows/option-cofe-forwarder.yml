name: Option Cofe Forwarder

on:
  schedule:
    # شنبه تا چهارشنبه، هر ۱۵ دقیقه (ساعت ۸:۳۰ تا ۱۷:۳۰ تهران)
    - cron: '*/15 5-14 * * 6,0-3'
  workflow_dispatch:

concurrency:
  group: option-cofe-forwarder
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Option Cofe Forwarder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
        run: |
          python option_cofe_forwarder.py

      - name: Save State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f option_cofe_state.json ]; then
            git add option_cofe_state.json
            git diff --staged --quiet || (git commit -m "chore: update option cofe state" && git push)
          fi
