name: Market Monitor Run

on:
  schedule:
    # اجرا هر ۵ دقیقه در ساعات بازار (بر مبنای ساعت UTC)
    - cron: '*/5 5-14 * * 0-4'
  workflow_dispatch:

concurrency:
  group: market-monitor
  cancel-in-progress: false

jobs:
  run-market-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright beautifulsoup4
          playwright install chromium

      - name: Run Market Monitor Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
        run: |
          python bot.py

      - name: Commit and Push State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f market_monitor_state.json ]; then
            git add market_monitor_state.json
            git diff --staged --quiet || git commit -m "chore: update market hash state"
            git pull --rebase origin main || (git stash && git pull --rebase origin main && git stash pop || true)
            git push origin main
          fi
