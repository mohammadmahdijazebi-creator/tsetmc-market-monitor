name: Market Monitor Run

on:
  schedule:
    # هر 5 دقیقه از ساعت 05:00 تا 14:30 به وقت UTC (معادل 08:30 تا 18:00 به وقت تهران) در روزهای شنبه تا چهارشنبه (0 تا 4)
    - cron: '*/5 5-14 * * 0-4'
  workflow_dispatch:

jobs:
  run-market-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium

      - name: Run Market Monitor Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
        run: |
          python bot.py
