name: run-market-monitor

on:
  schedule:
    # روزهای معاملاتی شنبه تا چهارشنبه، هر ۱۰ دقیقه بین ساعت ۹:۰۰ تا ۱۲:۳۰ صبح تهران
    # زمان به وقت UTC: 05:30 تا 09:00
    - cron: '*/10 5-9 * * 0-4'
  workflow_dispatch:

jobs:
  capture-and-send:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Run Market Monitor Script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
        BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
      run: |
        python capture_market.py
