name: Options Market Monitor

on:
  schedule:
    # اجرا هر ۵ دقیقه در ساعات معاملاتی (۸:۳۰ الی ۱۸:۰۰ به وقت تهران / ۵:۰۰ الی ۱۴:۳۰ به وقت UTC)
    # یکشنبه تا پنج‌شنبه (روزهای 0 تا 4 در کران)
    - cron: '*/5 5-14 * * 0-4'
  workflow_dispatch: # امکان اجرای دستی با دکمه Run workflow

jobs:
  run-options-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run Options Monitor Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
        run: |
          python options_monitor.py
