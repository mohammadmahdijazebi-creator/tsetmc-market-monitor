name: Other Channels Image Forwarder

on:
  schedule:
    # شنبه تا چهارشنبه، هر ۱۵ دقیقه، ساعت ۰۸:۳۰ تا ۱۸:۱۵ تهران
    # GitHub Actions از UTC استفاده می‌کند.
    - cron: "*/15 5-14 * * 6,0-3"
  workflow_dispatch:

concurrency:
  group: other-channels-forwarder
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Run other-channel forwarder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
        run: python other_channels_forwarder.py

      - name: Save other-channel state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add other_channels_state.json
          git diff --cached --quiet || git commit -m "chore: update other-channel forwarder state"
          git push
