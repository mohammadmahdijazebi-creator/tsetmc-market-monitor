name: All Channels Forwarder

on:
  workflow_dispatch:

concurrency:
  group: all-channels-forwarder
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Master Forwarder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
        run: |
          python master_channel_forwarder.py

      - name: Commit and Push State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f channels_state.json ]; then
            git add channels_state.json
            git pull --rebase origin main || true
            git diff --staged --quiet || (git commit -m "chore: update channels forwarder state" && git push)
          fi
