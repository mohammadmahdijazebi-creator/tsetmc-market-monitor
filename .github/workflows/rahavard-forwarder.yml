name: Rahavard Options Forwarder

on:
  schedule:
    # اجرا هر ۱۵ دقیقه در روزهای معاملاتی (یکشنبه تا پنج‌شنبه از ساعت ۹:۰۰ الی ۱۷:۰۰ به وقت تهران)
    - cron: '*/15 5-14 * * 0-4'
  workflow_dispatch: # امکان اجرای دستی

jobs:
  forward-options:
    runs-on: ubuntu-latest

    permissions:
      contents: write # دسترسی برای ذخیره ID آخرین پیام در ریپازیتوری

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Rahavard Forwarder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
        run: |
          python rahavard_options_forwarder.py

      - name: Commit and Push last processed ID
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f last_rahavard_option_id.txt ]; then
            git add last_rahavard_option_id.txt
            git diff --staged --quiet || (git commit -m "chore: update last processed rahavard option id" && git push)
          fi
