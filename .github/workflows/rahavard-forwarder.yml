name: Rahavard Channel Image Forwarder

on:
  schedule:
    # اجرا هر ۱۵ دقیقه از ساعت ۵ تا ۱۴:۴۵ UTC (۸:۳۰ تا ۱۸:۱۵ تهران) از یکشنبه تا پنج‌شنبه
    - cron: '*/15 5-14 * * 0-4'
  workflow_dispatch: # امکان اجرای دستی در هر لحظه

jobs:
  forward-images:
    runs-on: ubuntu-latest

    permissions:
      contents: write # مجوز push برای ذخیره فایل last_rahavard_post_id.txt

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Rahavard Image Forwarder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
        run: |
          python rahavard_forwarder.py

      - name: Commit and Push last processed ID
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f last_rahavard_post_id.txt ]; then
            git add last_rahavard_post_id.txt
            git diff --staged --quiet || (git commit -m "chore: update last rahavard post id" && git push)
          fi
